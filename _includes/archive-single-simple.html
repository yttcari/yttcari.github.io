{% include base_path %}
<div class="list__item">
  <article class="archive__item" itemscope itemtype="http://schema.org/CreativeWork">
    <h2 class="archive__item-title" itemprop="headline">
      <a href="{{ base_path }}{{ post.url }}" rel="permalink">{{ post.title }}</a>
    </h2>
    {% if post.period %}<p class="page__meta"><i class="fa fa-clock" aria-hidden="true"></i> {{ post.period }}</p>{% elsif post.date %}<p class="page__meta"><i class="fa fa-clock" aria-hidden="true"></i> {{ post.date | date: '%Y' }}</p>{% endif %}
    {% if post.subtitle %}<p class="archive__item-excerpt" itemprop="description">{{ post.subtitle }}</p>{% endif %}
    {% if post.excerpt %}<div class="archive__item-excerpt" itemprop="description">{{ post.excerpt | markdownify }}</div>{% endif %}
  </article>
</div>
